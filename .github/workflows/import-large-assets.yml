name: Import large Litch assets

on:
  push:
    paths:
      - ".github/workflows/import-large-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download original large assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          BASE="https://raw.githubusercontent.com/lzkkj/Litch_Vers-oFinal/backup-litch-vjs-java/images"
          curl -fL "$BASE/LitchLogo.png" -o "images/LitchLogo.png"
          curl -fL "$BASE/LogoLitch%2B.png" -o "images/LogoLitch+.png"
          curl -fL "$BASE/fallguys.jpg" -o "images/fallguys.jpg"
          curl -fL "$BASE/warframe.jpg" -o "images/warframe.jpg"

      - name: Restore local image references
        shell: python
        run: |
          from pathlib import Path

          base = "https://raw.githubusercontent.com/lzkkj/Litch_Vers-oFinal/backup-litch-vjs-java/images/"
          replacements = {
              base + "LitchLogo.png": "../images/LitchLogo.png",
              base + "LogoLitch%2B.png": "../images/LogoLitch+.png",
              base + "fallguys.jpg": "../images/fallguys.jpg",
              base + "warframe.jpg": "../images/warframe.jpg",
          }

          for path in Path("html").glob("*.html"):
              text = path.read_text(encoding="utf-8")
              new_text = text
              for old, new in replacements.items():
                  new_text = new_text.replace(old, new)
              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")

      - name: Commit imported assets
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images html
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: import large assets into Litch-VJS"
          git push
